<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="/favicon.png?v=blue2">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  
  <script>
    (() => {
      try {
        const saved = JSON.parse(localStorage.getItem("myzen_settings") || "{}");
        const theme = saved.theme || localStorage.getItem("myzen_theme") || "light";
        const valid = theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = valid;
        document.documentElement.style.colorScheme = valid;
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
<title>MYZEN MONEY - Login</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #d9f5ed, transparent 38%),
        linear-gradient(135deg, #eef4ff, #f8fbff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 15px;
      color: #17243b;
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
    }

    .auth-card {
      background: #ffffff;
      padding: 38px 35px;
      border-radius: 24px;
      box-shadow: 0 18px 55px rgba(22, 43, 76, 0.12);
      border: 1px solid #e8eef6;
    }

    .logo-area {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 65px;
      height: 65px;
      margin: 0 auto 12px;
      border-radius: 19px;
      background: linear-gradient(135deg, #073b70, #087f75);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 29px;
      font-weight: bold;
      box-shadow: 0 8px 20px rgba(7, 59, 112, .2);
    }

    .logo-area h1 {
      margin: 0;
      color: #073b70;
      font-size: 27px;
      letter-spacing: 1px;
      font-weight: 800;
    }

    .logo-area p {
      color: #8190a5;
      margin: 9px 0 0;
      font-size: 13px;
    }

    .welcome-title {
      font-size: 24px;
      margin: 0 0 8px;
      color: #17243b;
      text-align: center;
    }

    .welcome-subtitle {
      color: #8290a3;
      font-size: 13px;
      text-align: center;
      margin: 0 0 28px;
      line-height: 1.6;
    }

    .form-group {
      margin-bottom: 19px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #34445b;
    }

    input {
      width: 100%;
      height: 51px;
      padding: 0 14px;
      border: 1px solid #dce4ee;
      border-radius: 11px;
      background: #f9fbfd;
      font-size: 14px;
      outline: none;
      color: #26364d;
      transition: .2s;
    }

    input:focus {
      border-color: #087f75;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(8, 127, 117, .10);
    }

    input::placeholder {
      color: #a5b0bf;
    }

    .password-wrap {
      position: relative;
    }

    .password-wrap input {
      padding-right: 65px;
    }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #087f75;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      padding: 8px;
    }

    .btn-block {
      width: 100%;
      min-height: 51px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #073b70, #087f75);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(7, 80, 105, .18);
      transition: .2s;
    }

    .btn-block:hover {
      transform: translateY(-2px);
      box-shadow: 0 11px 22px rgba(7, 80, 105, .24);
    }

    .btn-block:disabled {
      opacity: .65;
      cursor: not-allowed;
      transform: none;
    }

    .secondary-btn {
      margin-top: 13px;
      background: #edf7f5;
      color: #087f75;
      border: 1px solid #d2eae5;
      box-shadow: none;
      font-size: 13px;
    }

    .secondary-btn:hover {
      background: #e1f2ee;
      box-shadow: none;
    }

    #loginMessage,
    #resendMessage {
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
      overflow-wrap: anywhere;
    }

    .register-link {
      text-align: center;
      margin: 25px 0 0;
      font-size: 13px;
      color: #7b8798;
    }

    .register-link a {
      color: #087f75;
      text-decoration: none;
      font-weight: 700;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .footer-note {
      text-align: center;
      color: #a0aaba;
      font-size: 11px;
      margin-top: 25px;
    }

    @media(max-width: 480px) {
      .auth-card {
        padding: 28px 21px;
        border-radius: 19px;
      }

      .logo-area h1 {
        font-size: 24px;
      }

      .welcome-title {
        font-size: 22px;
      }
    }
  </style>
  <link rel="stylesheet" href="css/theme.css?v=20261127">
</head>

<body>

<div class="auth-container">
  <div class="auth-card">

    <div class="logo-area">
      <div class="logo-icon">M</div>
      <h1>MYZEN MONEY</h1>
      <p>Your Money, Your World.</p>
    </div>

    <h2 class="welcome-title">Welcome Back</h2>

    <p class="welcome-subtitle">
      Login to access your MYZEN MONEY wallet.
    </p>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          placeholder="Enter your email"
          required
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>

        <div class="password-wrap">
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >

          <button
            type="button"
            class="toggle-password"
            onclick="toggleLoginPassword()"
          >SHOW</button>
        </div>
      </div>

      <button type="submit" id="loginBtn" class="btn-block">
        Login to My Wallet →
      </button>

    </form>

    <p id="loginMessage" role="status" aria-live="polite"></p>

    <div class="verification-area">
      <button
        type="button"
        id="resendVerificationBtn"
        class="btn-block secondary-btn"
      >
        Resend Verification Email
      </button>

      <p id="resendMessage" role="status" aria-live="polite"></p>
    </div>

    <p class="register-link">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </p>

    <p class="footer-note">
      MYZEN MONEY · Wallet Platform
    </p>

  </div>
</div>

<script>
  function toggleLoginPassword() {
    const password = document.getElementById("password");
    const button = document.querySelector(".toggle-password");

    if (password.type === "password") {
      password.type = "text";
      button.textContent = "HIDE";
    } else {
      password.type = "password";
      button.textContent = "SHOW";
    }
  }
</script>

<script type="module" src="js/login.js"></script>

</body>
</html>
