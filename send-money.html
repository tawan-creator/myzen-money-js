
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Send Money - MYZEN MONEY</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .send-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    .send-option{display:block;padding:30px 16px;text-align:center;background:white;
      border:1px solid #e2e8f0;border-radius:16px;color:#172033;text-decoration:none}
    .send-option:hover{border-color:#1455d9;background:#f5f8ff}
    .send-option .symbol{font-size:42px;display:block;margin-bottom:12px}
    .send-option strong{display:block;font-size:18px;margin-bottom:8px}
    .send-option small{color:#64748b}
    @media(max-width:500px){.send-options{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header class="topbar">
  <div class="brand">MYZEN MONEY</div>
  <a href="dashboard.html" style="color:white">Dashboard</a>
</header>

<main class="container">
  <h2 class="page-title">Send Money</h2>
  <div class="card">
    <h3>Choose Transfer Method</h3>
    <p class="text-muted">Select your preferred transfer method.</p>
    <div class="send-options">
      <a href="international.html" class="send-option">
        <span class="symbol">🌍</span>
        <strong>International</strong>
        <small>Thailand, Myanmar and other countries</small>
      </a>
      <a href="scan.html" class="send-option">
        <span class="symbol">📷</span>
        <strong>Scan QR</strong>
        <small>Scan a MYZEN MONEY wallet QR code</small>
      </a>
    </div>
  </div>
  <a class="btn btn-secondary" href="dashboard.html">Back to Dashboard</a>
</main>
</body>
</html>
